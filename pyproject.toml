[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tower-analyzer"
version = "0.1.0"
description = "The Tower Save Analyzer – reverse-engineer and analyze save files from The Tower (TechTreeGames)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
keywords = ["tower", "save-analyzer", "reverse-engineering", "game"]
authors = [{ name = "The Tower Analyzer Contributors" }]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.0",
    "rich>=13.0",
]

[project.scripts]
tower-analyzer = "tower_analyzer.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tower_analyzer"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
src = ["src"]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ANN", # flake8-annotations
    "N",   # pep8-naming
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
ignore = [
    "ANN204", # Missing return type annotation for special method
]

[tool.ruff.lint.isort]
known-first-party = ["tower_analyzer"]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"
packages = ["tower_analyzer"]
